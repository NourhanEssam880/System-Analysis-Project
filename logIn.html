<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In | Programming Courses</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Arial;
            background: #0a0f14;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            width: 380px;
            background: #111827;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.6);
            border: 1px solid #1f2937;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
            color: white;
            font-weight: 700;
        }

        label {
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 18px;
            border-radius: 8px;
            border: 1px solid #2d3648;
            background: #0f172a;
            color: #e2e8f0;
            font-size: 15px;
            transition: 0.25s;
        }

        input:focus {
            border-color: #3b82f6;
            outline: none;
            box-shadow: 0 0 6px rgba(59,130,246,0.6);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .extra-links {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .extra-links a {
            color: #3b82f6;
            text-decoration: none;
        }

        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>Log In</h2>

    <label>Email</label>
    <input type="email" placeholder="Enter your email" />

    <label>Password</label>
    <input type="password" placeholder="Enter your password" />

    <button>Log In</button>

    <div class="extra-links">
        <p>Don't have an account? <a href="Register.html">Register</a></p>
        <p><a href="#">Forgot your password?</a></p>
    </div>
</div>

</body>
</html>
