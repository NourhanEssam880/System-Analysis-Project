<!DOCTYPE html>
<html>
<head>
    <title>Login - Course Booking</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #6a11cb, #2575fc);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-box {
            background: white;
            width: 300px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background: #2575fc;
            color: white;
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #6a11cb;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>Login</h2>

    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">

    <button onclick="login()">Login</button>
</div>

<script>
function login() {
    alert("Login Successful!");
}
</script>

</body>
</html>
