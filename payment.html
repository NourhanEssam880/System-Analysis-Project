<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment | Programming Courses</title>
    <link rel="stylesheet" href="payment.css">
</head>
<body>

    <!-- ▬▬▬▬ NAV BAR ▬▬▬▬ -->
    <header>
        <h1 class="title">Programming Courses</h1>

        <nav class="navbar">
            <ul>
                <li><a href="Home.html">Home</a></li>
                <li><a href="Login.html">Log_in</a></li>
                <li><a href="Books/Carts.html">Books/Cart</a></li>
                <li><a href="Lecturers.html">Lecturers</a></li>
                <li><a href="Contact-Us.html">Contact_us</a></li>
                <li><a href="About-Us.html">About_us</a></li>

                <li><a href="Course_details.html">Course_details</a></li>
                <li><a href="Register.html">Register</a></li>
            </ul>
        </nav>
    </header>

    <!-- ▬▬▬▬ PAYMENT SECTION ▬▬▬▬ -->
    <div class="payment-container">
        <h2>Course Payment</h2>

        <form id="paymentForm">
            <label>Full Name</label>
            <input type="text" id="name" required>

            <label>Email</label>
            <input type="email" id="email" required>

            <label>Course</label>
            <select id="course">
                <option value="C Programming">C Programming</option>
                <option value="C++ Programming">C++ Programming</option>
                <option value="Java">Java </option>
                <option value="JavaScript">JavaScript </option>
                <option value="Python">Python </option>
            </select>

            <label>Card Number</label>
            <input type="text" id="card" maxlength="16" required>

            <label>Expiration Date</label>
            <input type="month" id="exp" required>

            <label>CVV</label>
            <input type="password" maxlength="3" id="cvv" required>

            <button type="submit">Pay Now</button>
        </form>

        <p id="successMessage" class="hidden">✔ Payment Completed Successfully!</p>
    </div>

    <script src="payment.js"></script>
</body>
</html>
